name: iOS scaffold

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/shared/**"
      - "docs/openapi/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run openapi:check
      - name: Detect iOS project
        id: detect
        shell: bash
        run: |
          if compgen -G "apps/ios/*.xcodeproj" > /dev/null || [ -f apps/ios/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate Swift OpenAPI client (optional)
        if: steps.detect.outputs.present == 'true'
        run: |
          brew install swift-openapi-generator 2>/dev/null || true
          bash apps/ios/Scripts/generate-openapi-client.sh
      - name: Install XcodeGen
        if: steps.detect.outputs.present == 'true'
        run: brew install xcodegen
      - name: Generate Xcode project
        if: steps.detect.outputs.present == 'true'
        run: cd apps/ios && xcodegen generate
      - name: Build and test iOS target
        if: steps.detect.outputs.present == 'true'
        run: |
          cd apps/ios
          xcodebuild test \
            -scheme TaakHelden \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet
      - name: Placeholder until iOS source lands
        if: steps.detect.outputs.present == 'false'
        run: echo "No Xcode project yet; workflow currently enforces the shared contract snapshot only."
