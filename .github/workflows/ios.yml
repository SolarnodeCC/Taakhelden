name: iOS scaffold

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/shared/**"
      - "docs/openapi/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run openapi:check
      - name: Detect iOS project
        id: detect
        shell: bash
        run: |
          if compgen -G "apps/ios/*.xcodeproj" > /dev/null || [ -f apps/ios/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Placeholder until iOS source lands
        if: steps.detect.outputs.present == 'false'
        run: echo "No Xcode project yet; workflow currently enforces the shared contract snapshot only."
