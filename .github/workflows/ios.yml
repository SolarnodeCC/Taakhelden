name: iOS scaffold

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/shared/**"
      - "docs/openapi/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run openapi:check
      - name: Detect iOS project
        id: detect
        shell: bash
        run: |
          if compgen -G "apps/ios/*.xcodeproj" > /dev/null || [ -f apps/ios/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate Swift OpenAPI client (optional)
        if: steps.detect.outputs.present == 'true'
        run: |
          brew install swift-openapi-generator 2>/dev/null || true
          bash apps/ios/Scripts/generate-openapi-client.sh
      - name: Install XcodeGen
        if: steps.detect.outputs.present == 'true'
        run: brew install xcodegen
      - name: Generate Xcode project
        if: steps.detect.outputs.present == 'true'
        run: cd apps/ios && xcodegen generate
      - name: Build and test iOS target
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd apps/ios

          # macos-latest simulator names drift (iPhone 16 → 17 → …). Pick the
          # newest available iPhone UDID instead of hardcoding a device name.
          UDID="$(
            xcrun simctl list devices available \
              | grep -E 'iPhone .+\([0-9A-Fa-f-]{36}\)' \
              | grep -v unavailable \
              | tail -1 \
              | grep -oE '[0-9A-Fa-f-]{36}' \
              | tail -1
          )"
          if [[ -z "${UDID}" ]]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "Using iPhone simulator: ${UDID}"
          xcodebuild test \
            -scheme TaakHelden \
            -destination "platform=iOS Simulator,id=${UDID}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Placeholder until iOS source lands
        if: steps.detect.outputs.present == 'false'
        run: echo "No Xcode project yet; workflow currently enforces the shared contract snapshot only."
