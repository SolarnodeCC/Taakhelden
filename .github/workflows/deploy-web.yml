name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }   # wrangler 4 vereist Node >= 22
      - run: npm ci
      - name: Build (OpenNext → Cloudflare Worker)
        working-directory: apps/web
        run: npm run build:cf
      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
        run: npx wrangler deploy
      # Retry: een verse deploy heeft enkele seconden nodig om wereldwijd te
      # propageren, dus de eerste hit kan 404 geven.
      - name: Smoke test
        run: |
          set -e
          # Pages need a few seconds to propagate after deploy.
          curl --fail -sSL --retry 6 --retry-delay 5 --retry-all-errors \
            https://taakhelden-web.oostelaar.workers.dev/nl/login >/dev/null
          # BFF must reach the API Worker (wrong API_BASE_URL previously yielded
          # opaque 404s on /api/auth/*). Login with unknown credentials → 401.
          code=$(curl -sS -o /tmp/bff-login.json -w "%{http_code}" \
            -X POST https://taakhelden-web.oostelaar.workers.dev/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@example.com","password":"not-a-real-password"}')
          echo "BFF login status=$code body=$(cat /tmp/bff-login.json)"
          test "$code" = "401"
