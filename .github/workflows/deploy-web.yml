name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }   # wrangler 4 vereist Node >= 22
      - run: npm ci
      - name: Build (OpenNext → Cloudflare Worker)
        working-directory: apps/web
        run: npm run build:cf
      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
        run: npx wrangler deploy
      # Retry: een verse deploy heeft enkele seconden nodig om wereldwijd te
      # propageren, dus de eerste hit kan 404 geven.
      - name: Smoke test
        run: curl --fail -sSL --retry 6 --retry-delay 5 --retry-all-errors https://taakhelden-web.oostelaar.workers.dev/nl/login
