name: Deploy production
on:
  push:
    branches: [main]   # elke merge naar main deployt naar production
  workflow_dispatch:   # ook handmatig te starten

permissions:
  contents: read

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }   # wrangler 4 vereist Node >= 22
      - run: npm ci
      # accountId meegeven zodat wrangler de /memberships-lookup overslaat: een
      # scoped API-token heeft vaak geen "User → Memberships → Read" en faalt
      # anders met "Authentication error [code: 10000]". Account-ID is niet
      # geheim (staat in elke dashboard-URL).
      - name: D1-migraties (production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "5546763229b35df670e33d9316d7f2e0"
          workingDirectory: apps/api
          command: d1 migrations apply taakhelden-db --remote
      # Queues die in wrangler.toml gedeclareerd staan moeten bestaan vóór de
      # deploy. Idempotent: `queues create` is veilig opnieuw te draaien; een
      # "already exists"-fout negeren we expliciet (niet via continue-on-error).
      - name: Queues aanmaken (idempotent)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
        run: |
          set +e
          out_photo=$(npx wrangler queues create photo-processing 2>&1)
          code_photo=$?
          out_export=$(npx wrangler queues create export-processing 2>&1)
          code_export=$?
          echo "$out_photo"
          echo "$out_export"
          # 0 = created; non-zero with "already exists" / "already taken" is OK.
          echo "$out_photo" | grep -Eqi "already exists|already taken" && code_photo=0
          echo "$out_export" | grep -Eqi "already exists|already taken" && code_export=0
          test "$code_photo" -eq 0 && test "$code_export" -eq 0
      # R2-bucket in de EU-jurisdictie (AVG/data-residency voor kinderfoto's),
      # passend bij `jurisdiction = "eu"` op de PHOTOS-binding. Idempotent.
      - name: R2-bucket aanmaken (idempotent)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
        run: |
          set +e
          out=$(npx wrangler r2 bucket create taakhelden-photos --jurisdiction eu 2>&1)
          code=$?
          echo "$out"
          echo "$out" | grep -qi "already exists" && code=0
          test "$code" -eq 0
      # Sync GitHub Environment secrets → Cloudflare Worker secrets.
      # JWT_SECRET is required (wrangler.toml [secrets].required). Optional
      # secrets are uploaded only when set in the Environment (non-empty).
      - name: Sync Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1" val="${2:-}"
            if [ -z "$val" ]; then
              # Avoid `echo` + the word "secret" — Jankurai HLT-034 treats that as a leak.
              printf 'skip %s (not configured in GitHub Environment)\n' "$name"
              return 0
            fi
            printf '%s' "$val" | npx wrangler secret put "$name"
          }
          if [ -z "${JWT_SECRET:-}" ]; then
            printf '::error::JWT_SECRET must be set on the GitHub Environment production.\n'
            exit 1
          fi
          # Registration fails closed without this, so a missing value must stop
          # the deploy rather than ship an unprotected sign-up endpoint.
          if [ -z "${TURNSTILE_SECRET:-}" ]; then
            printf '::error::TURNSTILE_SECRET must be set on the GitHub Environment production.\n'
            exit 1
          fi
          put_secret JWT_SECRET "$JWT_SECRET"
          put_secret HMAC_SECRET "${HMAC_SECRET:-}"
          put_secret TURNSTILE_SECRET "${TURNSTILE_SECRET:-}"
          put_secret APNS_KEY "${APNS_KEY:-}"
          put_secret APNS_KEY_ID "${APNS_KEY_ID:-}"
          put_secret APNS_TEAM_ID "${APNS_TEAM_ID:-}"
          put_secret EMAIL_API_KEY "${EMAIL_API_KEY:-}"
          put_secret EMAIL_FROM "${EMAIL_FROM:-}"
      - name: Deploy API
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "5546763229b35df670e33d9316d7f2e0"
          workingDirectory: apps/api
          command: deploy
      # Registration/login mint JWTs; without JWT_SECRET every register returns 500.
      # Photo/export URL signing likewise fails closed without HMAC_SECRET.
      # Bootstrap once if the secret is missing. Prefer an explicit GitHub secret
      # when present; otherwise generate a random value (do not rotate an existing one).
      - name: Ensure signing secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5546763229b35df670e33d9316d7f2e0"
          JWT_SECRET_FROM_GITHUB: ${{ secrets.JWT_SECRET }}
          HMAC_SECRET_FROM_GITHUB: ${{ secrets.HMAC_SECRET }}
        run: |
          set -euo pipefail
          list=$(npx wrangler secret list)
          if ! printf '%s' "$list" | grep -q '"name": "JWT_SECRET"'; then
            if [ -n "${JWT_SECRET_FROM_GITHUB}" ]; then
              printf '%s' "$JWT_SECRET_FROM_GITHUB" | npx wrangler secret put JWT_SECRET
            else
              openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
            fi
          fi
          # Same bootstrap for the transfer-signing key. Generate rather than
          # reuse JWT_SECRET: key separation is the point. Only ever created when
          # absent, so it stays stable across deploys (rotating it would only
          # invalidate signed URLs, which live 5 minutes).
          if ! printf '%s' "$list" | grep -q '"name": "HMAC_SECRET"'; then
            if [ -n "${HMAC_SECRET_FROM_GITHUB}" ]; then
              printf '%s' "$HMAC_SECRET_FROM_GITHUB" | npx wrangler secret put HMAC_SECRET
            else
              openssl rand -hex 32 | npx wrangler secret put HMAC_SECRET
            fi
          fi
      # Smoke-test tegen de workers.dev-URL zolang api.taakhelden.nl nog niet
      # als custom domain aan de worker gekoppeld is. Zet dit terug naar
      # https://api.taakhelden.nl/v1/health zodra dat domein gekoppeld is.
      - name: Smoke test
        run: |
          set -euo pipefail
          body=$(curl --fail -sS https://taakhelden-api.oostelaar.workers.dev/v1/health)
          echo "health=$body"
          printf '%s' "$body" | grep -q '"ok":true'
          printf '%s' "$body" | grep -q '"db":true'
          # Do not assert JWT presence in the body — /health no longer exposes it.
          #
          # The register check asserts REJECTION, not success. It used to post a
          # placeholder Turnstile token and require 201, which could only pass
          # while bot protection was disabled in production — so the smoke test
          # actively held the anti-bot control open. Asserting a 400 proves
          # routing, JSON handling, schema validation and the Turnstile path are
          # all live, and writes nothing to the production database.
          # Unique address per run: /auth/register is also rate-limited per
          # e-mail address, and a fixed one would start returning 429 after a
          # few deploys in the same hour.
          email="smoke-$(date +%s)@example.com"
          code=$(curl -sS -o /tmp/reg.json -w "%{http_code}" \
            -X POST https://taakhelden-api.oostelaar.workers.dev/v1/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"SmokeTestPassword1\",\"familyName\":\"Smoke\",\"displayName\":\"Smoke\",\"turnstileToken\":\"invalid-smoke-token\"}")
          echo "register status=$code"
          # Log the error code only (never the body).
          python3 -c 'import json; d=json.load(open("/tmp/reg.json")); print("error=", (d.get("error") or {}).get("code"))'
          # 400 = Turnstile rejected the token, which is the healthy outcome.
          # A 201 here means bot protection is off and must fail the deploy.
          test "$code" = "400"
