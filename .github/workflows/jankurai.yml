name: Jankurai (advisory)

# Read-only, niet-blokkerende Jankurai-audit via de officiële action. De action
# bouwt de CLI uit háár eigen checkout (`cargo install --path .../crates/jankurai`)
# zodat de JSON-schemas naast de binary staan — precies wat de losse
# prebuilt-binary miste, waardoor `jankurai audit` eerder faalde met
# "repo-score.schema.json: No such file or directory".
#
# BEWUST niet-blokkerend: ci.yml blijft de bron van waarheid voor groen/rood
# (zie claude.yml). Deze workflow faalt de PR nooit — hij levert alleen inzicht
# en een evidence-artifact. Zet 'm pas op `mode: ratchet` met een baseline als
# het team de scores een paar runs heeft gezien en bewust wil poorten
# (zie agent/baselines/README.md).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Advies, geen poort: een audit- of build-fout mag de run niet rood maken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ratchet/diff-vergelijkingen hebben git-historie nodig

      # Officiële Jankurai-action, vastgepind op de commit-SHA van v1.5.1
      # (supply-chain — net als claude-code-action). De action installeert de
      # Rust-toolchain, bouwt de CLI uit haar checkout en draait
      # `jankurai audit . --mode advisory` met de juiste v1.5.1-vlaggen
      # (--json/--md/--sarif/--github-step-summary/--repair-queue-jsonl) en
      # publiceert de samenvatting zelf in de job-summary. Bump SHA + comment
      # samen bij een update.
      - name: Jankurai audit (advisory)
        continue-on-error: true
        uses: neverhuman/jankurai@3c804453e6c7a6e0e4028d95cc3bccea467277ef # v1.6.10
        with:
          mode: advisory

      - name: Upload evidence-artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jankurai-evidence
          path: target/jankurai/
          if-no-files-found: warn
