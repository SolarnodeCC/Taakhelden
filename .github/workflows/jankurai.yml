name: Jankurai (regression gate)

# Jankurai-audit via de officiële action. De action bouwt de CLI uit háár eigen
# checkout (`cargo install --path .../crates/jankurai`) zodat de JSON-schemas
# naast de binary staan — precies wat de losse prebuilt-binary miste, waardoor
# `jankurai audit` eerder faalde met "repo-score.schema.json: No such file or
# directory".
#
# `mode: ratchet` tegen de baseline in agent/baselines/main.repo-score.json
# (score 44, vastgelegd vanaf een schone commit — zie dat bestand en
# agent/baselines/README.md). Deze job faalt nu ECHT bij een regressie t.o.v.
# die baseline; ci.yml blijft daarnaast de bron van waarheid voor de
# typecheck/test/migratie-gate (zie claude.yml). Of een faalde `audit`-job de
# PR ook daadwerkelijk blokkeert hangt af van de branch-protection-instellingen
# (required status checks) — dat is een repo-instelling, geen keuze van deze
# workflow.
#
# Bekende valse-positieve categorieën in de huidige score (v1.5.1-heuristieken,
# geen echte bugs — geverifieerd bij het leggen van de baseline):
#   - `stub.fetch(...)` (Durable Object binding, Cloudflare-idioom) wordt
#     gelezen als een "vibe-coding stub/placeholder"-marker.
#   - Whitelisted-column dynamic UPDATE (`SET ${sets.join(", ")}` met alleen
#     gebonden `?`-waarden, zie apps/api/src/repo/{tasks,families}.ts) wordt
#     gelezen als "raw command SQL" / injection-risico.
#   - `JSON.parse(...) as T` na een D1-read wordt als ongevalideerde any-cast
#     geflagged, ook waar een handmatige guard er meteen achteraan staat.
# Een regressiemelding op exact deze patronen is vermoedelijk ruis, niet een
# echte achteruitgang — controleer de repair-queue voordat je een PR blokkeert.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ratchet-vergelijking heeft git-historie nodig

      # Officiële Jankurai-action, vastgepind op de commit-SHA van v1.5.1
      # (supply-chain — net als claude-code-action). De action installeert de
      # Rust-toolchain, bouwt de CLI uit haar checkout en draait
      # `jankurai audit . --mode ratchet --baseline agent/baselines/main.repo-score.json`
      # met de juiste v1.5.1-vlaggen en publiceert de samenvatting zelf in de
      # job-summary. Bump SHA + comment samen bij een update.
      - name: Jankurai audit (ratchet)
        uses: neverhuman/jankurai@6f1aa45fca09ebb523f79b38ad465da28a86dfb1 # v1.5.1
        with:
          mode: ratchet
          baseline: agent/baselines/main.repo-score.json

      - name: Upload evidence-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jankurai-evidence
          path: target/jankurai/
          if-no-files-found: warn
