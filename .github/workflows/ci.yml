name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }   # wrangler 4 vereist Node >= 22
      - run: npm ci
      - run: npm run openapi:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (Workers-runtime)
        run: npm test
      - name: D1-migraties dry-run
        working-directory: apps/api
        run: npx wrangler d1 migrations apply taakhelden-db --local
