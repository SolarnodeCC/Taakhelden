name = "taakhelden-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# --- default/base-omgeving (production erft hiervan via [env.production]) ---
[[d1_databases]]
binding = "DB"
database_name = "taakhelden-db"
database_id = "031e773c-bad4-40fa-ad65-984f40c1992c"   # wrangler d1 create taakhelden-db --location=weur

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "taakhelden-photos"
jurisdiction = "eu"                                # EU data-residency voor kinderfoto's (AVG)

[[kv_namespaces]]
binding = "KV"
id = "5f1fabd9e81f4fd7843a7cbe8ba5f2ac"

[[durable_objects.bindings]]
name = "FAMILY_DO"
class_name = "FamilyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyRoom"]  # SQLite-backed DO (KV-backed niet meer toegestaan op nieuwe accounts)

[[queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-processing"

[[queues.consumers]]
queue = "photo-processing"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "export-processing"

[[queues.consumers]]
queue = "export-processing"

[triggers]
crons = ["5 0 * * *", "*/15 * * * *"]  # 00:05 instance-generatie · elke 15 min notificaties

# Plain-text vars (safe in git). Secrets stay out of this file — see [secrets] + CI sync.
[vars]
APP_BASE_URL = "https://taakhelden-web.oostelaar.workers.dev"
APNS_ENV = "sandbox"
APPLE_CLIENT_ID = "com.taakhelden.web"
APPLE_BUNDLE_ID = "nl.taakhelden.app"

# Deploy fails if these are missing on the Worker. Set via GitHub Environment
# secrets (synced in deploy-prod.yml) or `npx wrangler secret put <NAME>`.
# Optional secrets (APNs key / email) are listed in
# docs/cloudflare-bindings-audit.md and synced when present in GitHub.
#
# TURNSTILE_SECRET is required: registration fails closed without it, so a
# missing secret must break the deploy rather than silently disable bot
# protection on the only unauthenticated account-creation endpoint.
# HMAC_SECRET is required so photo/export URL signing never falls back to
# JWT_SECRET — a leaked transfer URL must not become a token-forging key.
# deploy-prod.yml generates one when the GitHub Environment has none.
[secrets]
required = ["JWT_SECRET", "TURNSTILE_SECRET", "HMAC_SECRET"]

[env.production]
name = "taakhelden-api-prod"
# production heeft eigen D1/R2/KV — id's invullen na aanmaken
