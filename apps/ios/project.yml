name: TaakHelden
options:
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: nl.taakhelden.family
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: nl
    # iPhone + iPad. Multitasking is required on iPad (no UIRequiresFullScreen).
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      TAAKHELDEN_API_BASE_URL: http://localhost:8787/v1
    Release:
      # Staging Workers URL until api.taakhelden.nl is attached; override in CI/xcconfig for prod.
      TAAKHELDEN_API_BASE_URL: https://taakhelden-api.oostelaar.workers.dev/v1
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
targets:
  TaakHelden:
    type: application
    platform: iOS
    sources:
      - path: TaakHelden
        excludes:
          - Info.plist
          - "*.entitlements"
    resources:
      - path: TaakHelden/Resources
    info:
      path: TaakHelden/Info.plist
      properties:
        TAAKHELDEN_API_BASE_URL: $(TAAKHELDEN_API_BASE_URL)
    entitlements:
      path: TaakHelden/TaakHelden.Debug.entitlements
    settings:
      base:
        PRODUCT_NAME: TaakHelden
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TaakHelden/TaakHelden.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TaakHelden/TaakHelden.Release.entitlements
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
  TaakHeldenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaakHeldenTests
    dependencies:
      - target: TaakHelden
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TaakHelden:
    build:
      targets:
        TaakHelden: all
        TaakHeldenTests: [test]
    test:
      targets:
        - TaakHeldenTests
