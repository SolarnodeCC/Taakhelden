name: TaakHelden
options:
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: nl.taakhelden.family
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: nl
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
targets:
  TaakHelden:
    type: application
    platform: iOS
    sources:
      - path: TaakHelden
        excludes:
          - Info.plist
    resources:
      - path: TaakHelden/Resources
    info:
      path: TaakHelden/Info.plist
    entitlements:
      path: TaakHelden/TaakHelden.entitlements
    settings:
      base:
        PRODUCT_NAME: TaakHelden
        CODE_SIGN_ENTITLEMENTS: TaakHelden/TaakHelden.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
  TaakHeldenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaakHeldenTests
    dependencies:
      - target: TaakHelden
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TaakHelden:
    build:
      targets:
        TaakHelden: all
        TaakHeldenTests: [test]
    test:
      targets:
        - TaakHeldenTests
